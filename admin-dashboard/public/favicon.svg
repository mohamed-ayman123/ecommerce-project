<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <style>
    .brand-stroke {
      stroke: #2F4842;
    }
    .node-stroke {
      stroke: #2F4842;
    }
    @media (prefers-color-scheme: dark) {
      .brand-stroke {
        stroke: #FFFFFF;
      }
      .node-stroke {
        stroke: #1D2826;
      }
    }
  </style>
  <!-- Outer Hexagon -->
  <polygon
    points="24,4 41.32,14 41.32,34 24,44 6.68,34 6.68,14"
    class="brand-stroke"
    stroke-width="4"
    stroke-linejoin="round"
  />
  <!-- Vertical Center Line -->
  <line
    x1="24"
    y1="4"
    x2="24"
    y2="44"
    class="brand-stroke"
    stroke-width="3.5"
  />
  <!-- Center Node (Nexis Gold) -->
  <circle
    cx="24"
    cy="24"
    r="7.5"
    fill="#DDA136"
    class="node-stroke"
    stroke-width="2"
  />
</svg>